name: Native security (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql-cpp:
    name: CodeQL C++ (manual)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build C++ for analysis
        working-directory: native
        run: |
          python -m pip install scons==4.11.1
          scons platform=macos target=template_debug -j3
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: /language:c-cpp
