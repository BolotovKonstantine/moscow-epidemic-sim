name: Native security (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql-cpp:
    name: CodeQL C++ (manual)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build C++ for analysis
        working-directory: native
        run: |
          python -m pip install scons==4.11.1
          scons platform=macos target=template_debug -j3
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: /language:c-cpp
