name: Native security (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql-cpp:
    name: CodeQL C++ (manual)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: github/codeql-action/init@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build C++ for analysis
        working-directory: native
        run: |
          python -m pip install scons==4.11.1
          scons platform=macos target=template_debug -j3
      - uses: github/codeql-action/analyze@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          category: /language:c-cpp
