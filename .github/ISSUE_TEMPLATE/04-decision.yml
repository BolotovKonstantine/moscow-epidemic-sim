name: "Обсуждение решения"
description: "Согласование механики, архитектуры или изменения требований"
labels:
  - "question"
body:
  -
    type: "markdown"
    attributes:
      value: "Правила: [ведение проекта](https://github.com/BolotovKonstantine/moscow-epidemic-sim/blob/main/docs/project-management.md). Одна Issue — один проверяемый результат. Неизвестные значения отмечай явно."
  -
    type: "dropdown"
    id: "stage"
    attributes:
      label: "Этап"
      options:
        - "0. Техническая основа"
        - "1. Городские данные"
        - "2. Просмотр города"
        - "3. Движение и масштаб"
        - "4. Болезнь и медицина"
        - "5. Решения мэра"
        - "6. Обе стороны"
        - "7. Проверка модели и игры"
        - "8. Подготовка iOS"
        - "Общее / этап требует решения"
    validations:
      required: true
  -
    type: "dropdown"
    id: "module"
    attributes:
      label: "Основной модуль"
      options:
        - "game — интерфейс и отображение"
        - "native — расчётное ядро и мост"
        - "city_pipeline — данные"
        - "tests / benchmarks — проверки"
        - "docs — требования и документация"
        - ".github — CI и процесс"
        - "Несколько модулей (перечислить в описании)"
    validations:
      required: true
  -
    type: "textarea"
    id: "problem"
    attributes:
      label: "Проблема и границы"
      description: "Какое решение требуется и почему оно нужно сейчас? Что не входит в обсуждение?"
    validations:
      required: true
  -
    type: "textarea"
    id: "options"
    attributes:
      label: "Варианты"
      description: "Сравни варианты, включая сохранение текущего подхода, если это уместно."
    validations:
      required: true
  -
    type: "textarea"
    id: "effects"
    attributes:
      label: "Последствия"
      description: "Влияние на инварианты, данные, память, производительность, платформы и масштаб первой версии. Неприменимое отметь явно."
    validations:
      required: true
  -
    type: "textarea"
    id: "proposal"
    attributes:
      label: "Предложение"
      description: "Предпочтительный вариант и доводы. Это предложение, пока автор не принял решение."
    validations:
      required: true
  -
    type: "textarea"
    id: "verification"
    attributes:
      label: "Как проверить выбор"
      description: "Эксперимент/замер или критерий принятия решения; какой результат считается достаточным?"
    validations:
      required: true
  -
    type: "textarea"
    id: "dependencies"
    attributes:
      label: "Зависимости и открытые вопросы"
      description: "Ссылки на связанные Issues и документы. Если зависимостей нет — «нет»."
    validations:
      required: true
